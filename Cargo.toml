[package]
name = "rs-flint"
version = "0.1.11"
edition = "2024"
license = "Apache-2.0"
description = "RustScript-native AI inference with Torch, llama.cpp, and stable-diffusion.cpp"

[lib]
name = "flint_ai"
path = "src/lib.rs"

[[bin]]
name = "flint"
path = "src/bin/flint-ai.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
image = "0.25"
imageproc = "0.27"
koharu-runtime = { git = "https://github.com/mayocream/koharu.git", branch = "refactor/0705", package = "koharu-runtime" }
koharu-diffusion = { git = "https://github.com/mayocream/koharu.git", branch = "refactor/0705", package = "koharu-diffusion" }
koharu-llama = { git = "https://github.com/mayocream/koharu.git", branch = "refactor/0705", package = "koharu-llama" }
koharu-torch = { git = "https://github.com/mayocream/koharu.git", branch = "refactor/0705", package = "koharu-torch" }
libloading = "0.8"
pd-host-function = { git = "https://github.com/rustscript-lang/rustscript", rev = "b1d6cffede77f49410bf63525f30b9a46b02dc01" }
tokenizers = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript", rev = "b1d6cffede77f49410bf63525f30b9a46b02dc01", default-features = false, features = ["runtime", "cranelift-jit"] }

[dev-dependencies]
tempfile = "3"

# Locked koharu-diffusion 3a832b5 wrappers use i32 FFI discriminants; bindgen on
# this toolchain emits c_uint. Path patch keeps koharu-diffusion-sys on the lock.
[patch."https://github.com/mayocream/koharu.git"]
koharu-diffusion = { path = "third_party/koharu-diffusion" }
