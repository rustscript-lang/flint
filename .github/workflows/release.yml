name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload files to"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  build-runner:
    name: Build Flint runner (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            exe_suffix: ""
          # CUDA 13.1 integrates with Visual Studio 2022, available on this image.
          - os: windows-2022
            platform: windows-x86_64
            exe_suffix: ".exe"
          - os: macos-15
            platform: macos-arm64
            exe_suffix: ""

    steps:
      - name: Checkout Flint
        uses: actions/checkout@v4
        with:
          path: flint

      - name: Checkout RustScript / pd-vm
        uses: actions/checkout@v4
        with:
          repository: rustscript-lang/rustscript
          path: rustscript

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA Toolkit
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: "13.1.0"

      - name: Build release runner
        working-directory: flint
        run: cargo build --release --locked --bin flint

      - name: Install portable Linux loader tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Package runner
        id: package
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE_SUFFIX: ${{ matrix.exe_suffix }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          import os
          import pathlib
          import shutil
          import subprocess
          import zipfile

          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", pathlib.Path.cwd())) / "flint"
          cargo_target_dir = pathlib.Path(os.environ.get("CARGO_TARGET_DIR", "target"))
          if not cargo_target_dir.is_absolute():
              cargo_target_dir = root / cargo_target_dir
          release_dir = cargo_target_dir / "release"
          package_name = f"flint-{os.environ['PLATFORM']}"
          package_dir = root / "dist" / package_name
          archive = root / "dist" / f"{package_name}.zip"
          exe_suffix = os.environ.get("EXE_SUFFIX", "")

          if package_dir.exists():
              shutil.rmtree(package_dir)
          package_dir.mkdir(parents=True, exist_ok=True)

          binary = release_dir / f"flint{exe_suffix}"
          if not binary.exists():
              raise FileNotFoundError(f"missing built runner binary: {binary}")
          shutil.copy2(binary, package_dir / binary.name)

          # tch-rs downloads LibTorch into torch-sys's build output. Locate it
          # under the package target as well as the workspace target fallback.
          torch_lib_name = (
              "torch.dll"
              if os.environ["RUNNER_OS"] == "Windows"
              else "libtorch.dylib"
              if os.environ["RUNNER_OS"] == "macOS"
              else "libtorch.so"
          )
          search_roots = [
              release_dir / "build",
              root / "target" / "release" / "build",
              root / "target" / "debug" / "build",
              pathlib.Path(os.environ.get("GITHUB_WORKSPACE", pathlib.Path.cwd()))
              / "target" / "release" / "build",
              pathlib.Path(os.environ.get("GITHUB_WORKSPACE", pathlib.Path.cwd()))
              / "target" / "debug" / "build",
          ]
          torch_lib_dirs = []
          for build_root in search_roots:
              if not build_root.is_dir():
                  continue
              for torch_root in build_root.glob("torch-sys-*/out/libtorch"):
                  candidates = [torch_root / "lib", *torch_root.glob("*/lib")]
                  for candidate in candidates:
                      if (candidate / torch_lib_name).is_file():
                          torch_lib_dirs.append(candidate)
          if not torch_lib_dirs:
              # Some runner images provide LibTorch system-wide; tch still
              # links it but torch-sys has no downloaded build directory.
              if os.environ["RUNNER_OS"] == "Linux":
                  probe = subprocess.run(
                      ["ldd", str(binary)], text=True, capture_output=True
                  )
                  for line in probe.stdout.splitlines():
                      if "libtorch.so" in line and "=>" in line:
                          candidate = pathlib.Path(
                              line.split("=>", 1)[1].strip().split(" (", 1)[0]
                          ).parent
                          if (candidate / torch_lib_name).is_file():
                              torch_lib_dirs.append(candidate)
              elif os.environ["RUNNER_OS"] == "macOS":
                  probe = subprocess.run(
                      ["otool", "-L", str(binary)], text=True, capture_output=True
                  )
                  for line in probe.stdout.splitlines():
                      if "libtorch.dylib" in line:
                          candidate = pathlib.Path(
                              line.strip().split(" (", 1)[0]
                          ).parent
                          if (candidate / torch_lib_name).is_file():
                              torch_lib_dirs.append(candidate)
              else:
                  probe = subprocess.run(
                      ["where", "torch.dll"], text=True, capture_output=True
                  )
                  for line in probe.stdout.splitlines():
                      candidate = pathlib.Path(line.strip()).parent
                      if (candidate / torch_lib_name).is_file():
                          torch_lib_dirs.append(candidate)
          torch_lib_dirs = sorted(set(torch_lib_dirs))
          if len(torch_lib_dirs) != 1:
              checked = ", ".join(str(path) for path in search_roots)
              raise RuntimeError(
                  f"expected one tch-rs LibTorch directory, found {torch_lib_dirs}; checked {checked}"
              )
          torch_lib = torch_lib_dirs[0]
          torch_pattern = {
              "Windows": "*.dll",
              "macOS": "*.dylib",
              "Linux": "*.so*",
          }[os.environ["RUNNER_OS"]]
          for source in torch_lib.glob(torch_pattern):
              if source.is_file():
                  shutil.copy2(source, package_dir / source.name)

          if os.environ["RUNNER_OS"] == "Linux":
              subprocess.run(["patchelf", "--set-rpath", "$ORIGIN", str(package_dir / binary.name)], check=True)
          elif os.environ["RUNNER_OS"] == "macOS":
              subprocess.run(["install_name_tool", "-add_rpath", "@executable_path", str(package_dir / binary.name)], check=True)

          native_library_patterns = {
              "Windows": "koharu*.dll",
              "macOS": "libkoharu*.dylib",
              "Linux": "libkoharu*.so",
          }
          pattern = native_library_patterns[os.environ["RUNNER_OS"]]
          for source in release_dir.glob(pattern):
              shutil.copy2(source, package_dir / source.name)

          for extra in ("README.md", "LICENSE"):
              source = root / extra
              if source.exists():
                  shutil.copy2(source, package_dir / extra)

          platform = os.environ["PLATFORM"]
          if platform == "windows-x86_64":
              required = ("flint.exe", "torch.dll", "torch_cpu.dll", "c10.dll")
          elif platform == "macos-arm64":
              required = ("flint", "libtorch.dylib", "libtorch_cpu.dylib", "libc10.dylib")
          else:
              required = ("flint", "libtorch.so", "libtorch_cpu.so", "libc10.so")
          missing = [name for name in required if not (package_dir / name).is_file()]
          if missing:
              raise RuntimeError(f"release package is missing: {', '.join(missing)}")

          all_files = sorted(path for path in package_dir.rglob("*") if path.is_file())
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in all_files:
                  zf.write(path, path.relative_to(package_dir.parent))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive={archive.as_posix()}\n")

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
